server:
  port: 8084

spring:
  application:
    name: matchmaking-service
  datasource:
    url: jdbc:postgresql://localhost:5432/matchmaking_db
    username: postgres
    password: password123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

services:
  identity-url: http://localhost:8081
  facility-url: http://localhost:8082
  booking-url: http://localhost:8083