server:
  port: 8081

spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://localhost:5432/identity_db
    username: postgres
    password: password123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    # Khóa bí mật dùng để ký JWT Token (tối thiểu 256-bit cho thuật toán HS256)
    secret: "SportsBookingPlatformSecretKeyForJwtAuthentication2026SuperSecure"
    expiration-ms: 86400000 # Token có hiệu lực trong 24 giờ