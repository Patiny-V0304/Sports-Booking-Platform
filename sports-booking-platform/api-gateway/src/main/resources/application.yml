server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # Cấu hình CORS toàn cục cho phép Frontend React gọi vào Gateway
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOriginPatterns:
                  - "http://localhost:*"
                  - "https://*.vercel.app"
                  - "https://*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
          routes:
            - id: identity-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**, /api/v1/users/**, /api/v1/profiles/**, /api/v1/admin/users/**

            - id: facility-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/facilities/**, /api/v1/courts/**, /api/v1/admin/facilities/**

            - id: booking-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/bookings/**, /api/v1/vouchers/**, /api/v1/payments/**, /api/v1/admin/configs/**

            - id: matchmaking-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/lobbies/**, /api/v1/reviews/**

app:
  jwt:
    secret: "SportsBookingPlatformSecretKeyForJwtAuthentication2026SuperSecure"